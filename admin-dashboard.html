<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delco Chimney Sweeps | Admin Dashboard</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh}
:root{
  --bg:#0f1117;--surface:#1a1f2e;--surface2:#242938;--border:#2d3548;
  --cyan:#00d4ff;--cyan-dim:#0099bb;--text:#e2e8f0;--muted:#8892a4;
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;
  --rad:10px;
}
button{cursor:pointer;font-family:'Inter',sans-serif}
input,select,textarea{font-family:'Inter',sans-serif;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 12px;width:100%;font-size:14px;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--cyan)}
label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:14px;font-weight:600;border:none;transition:all .15s}
.btn-primary{background:var(--cyan);color:#000}
.btn-primary:hover{background:#00bbdd}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--text)}
.btn-danger{background:var(--red);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:20px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.badge-draft{background:#1e293b;color:#64748b}
.badge-sent{background:#1e3a5f;color:#60a5fa}
.badge-approved{background:#14532d;color:#4ade80}
.badge-paid{background:#14532d;color:#4ade80}
.badge-unpaid{background:#431407;color:#fb923c}
.badge-new{background:#1e3a5f;color:#60a5fa}
.badge-scheduled{background:#1e3a5f;color:#60a5fa}
.badge-converted{background:#3b1f6e;color:#a78bfa}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:10px 12px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid #1a1f2e;font-size:14px;vertical-align:middle}
tr:hover td{background:#1a1f2e44}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);width:100%;max-width:720px;max-height:90vh;overflow-y:auto;padding:28px}
.modal-lg{max-width:900px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{margin-bottom:16px}
.form-full{grid-column:1/-1}
h1{font-size:22px;font-weight:700;color:var(--text)}
h2{font-size:18px;font-weight:700;color:var(--text)}
h3{font-size:15px;font-weight:600;color:var(--text)}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);min-height:100vh;padding:20px 0;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;overflow-y:auto}
.main{margin-left:220px;padding:28px;min-height:100vh}
.nav-logo{padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:12px}
.nav-logo h2{font-size:14px;color:var(--cyan);font-weight:700;line-height:1.3}
.nav-logo p{font-size:11px;color:var(--muted);margin-top:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;color:var(--muted);cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent}
.nav-item:hover{color:var(--text);background:#ffffff08}
.nav-item.active{color:var(--cyan);background:#00d4ff11;border-left-color:var(--cyan)}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:18px}
.stat-val{font-size:28px;font-weight:700;color:var(--cyan);font-variant-numeric:tabular-nums}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:gap}
.search-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.search-bar input{max-width:300px}
.empty{text-align:center;padding:48px;color:var(--muted)}
.total-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;color:var(--muted)}
.total-row.grand{font-size:18px;font-weight:700;color:var(--text);border-top:1px solid var(--border);padding-top:12px;margin-top:4px}
select option{background:#1a1f2e}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:14px 20px;z-index:999;font-size:14px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}
@media(max-width:768px){
  .sidebar{display:none}
  .main{margin-left:0;padding:16px}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="loginScreen" style="position:fixed;inset:0;background:#0f1117;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="background:#1a1f2e;border:1px solid #2d3548;border-radius:12px;padding:40px;width:100%;max-width:400px;text-align:center">
    <div style="font-family:'Inter',sans-serif;font-size:1.3rem;font-weight:700;color:#00d4ff;margin-bottom:4px;letter-spacing:.05em">DELCO CHIMNEY SWEEPS</div>
    <p style="font-size:.83rem;color:#8892a4;margin-bottom:28px">Admin Dashboard</p>
    <input id="loginPass" type="password" placeholder="Enter admin password" style="width:100%;padding:12px 14px;background:rgba(255,255,255,.05);border:1.5px solid #2d3548;border-radius:6px;font-size:.95rem;color:#e2e8f0;outline:none;margin-bottom:12px;font-family:'Inter',sans-serif;text-align:center" />
    <p id="loginErr" style="display:none;color:#ef4444;font-size:.82rem;margin-bottom:10px">Incorrect password.</p>
    <button id="loginBtn" style="width:100%;background:#00d4ff;color:#000;padding:12px;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:1rem;font-family:'Inter',sans-serif">Sign In →</button>
    <p style="font-size:.75rem;color:#4a5568;margin-top:16px">Delco Chimney Sweeps · Wallingford, PA</p>
  </div>
</div>

<div id="appRoot" style="display:none">
<div id="root"></div>
</div>
<script type="text/babel">
const { createClient } = supabase;
const { useState, useEffect, useCallback } = React;

const SUPABASE_URL = 'https://sfxwlimkshkmdgyofecp.supabase.co';
const SUPABASE_ANON = 'sb_publishable_KuB0-_42_bVJShQ-tT-Ldg_oovGR5CC';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

// ── ICONS ──────────────────────────────────────────────────────
const Icon = {
  dash: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>,
  users: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
  file: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>,
  invoice: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 7H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-3"/><path d="M9 7h8V3H9z"/><path d="m9 12 2 2 4-4"/></svg>,
  cal: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
  wrench: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>,
  inbox: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>,
  plus: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
  edit: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
  trash: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>,
  mail: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>,
  convert: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>,
  x: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
  check: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 12 4 10"/></svg>,
};

// ── TOAST ──────────────────────────────────────────────────────
function Toast({ msg, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
  return <div className={`toast ${type}`}>{msg}</div>;
}

// ── MODAL ──────────────────────────────────────────────────────
function Modal({ title, onClose, children, lg }) {
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className={`modal ${lg ? 'modal-lg' : ''}`}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
          <h2>{title}</h2>
          <button className="btn btn-ghost btn-sm" onClick={onClose}>{Icon.x}</button>
        </div>
        {children}
      </div>
    </div>
  );
}

// ── DASHBOARD ──────────────────────────────────────────────────
function Dashboard({ toast }) {
  const [stats, setStats] = useState({ customers:0, estimates:0, invoices:0, revenue:0, requests:0, scheduled:0 });
  const [recent, setRecent] = useState([]);

  useEffect(() => {
    async function load() {
      const [c, e, i, req, appt] = await Promise.all([
        sb.from('customers').select('id', {count:'exact', head:true}),
        sb.from('estimates').select('id', {count:'exact', head:true}),
        sb.from('invoices').select('total, payment_status'),
        sb.from('service_requests').select('id', {count:'exact', head:true}),
        sb.from('appointments').select('id', {count:'exact', head:true}).eq('status','scheduled'),
      ]);
      const revenue = (i.data||[]).filter(x=>x.payment_status==='paid').reduce((s,x)=>s+Number(x.total),0);
      setStats({ customers:c.count||0, estimates:e.count||0, invoices:(i.data||[]).length, revenue, requests:req.count||0, scheduled:appt.count||0 });
    }
    async function loadRecent() {
      const { data } = await sb.from('service_requests').select('*').order('created_at',{ascending:false}).limit(5);
      setRecent(data||[]);
    }
    load(); loadRecent();
  }, []);

  return (
    <div>
      <div style={{marginBottom:28}}>
        <h1>Dashboard</h1>
        <p style={{color:'var(--muted)',marginTop:4,fontSize:14}}>Welcome back — here's what's happening at Delco Chimney Sweeps</p>
      </div>
      <div className="stat-grid">
        <div className="stat-card"><div className="stat-val">{stats.customers}</div><div className="stat-label">Total Customers</div></div>
        <div className="stat-card"><div className="stat-val">{stats.estimates}</div><div className="stat-label">Estimates</div></div>
        <div className="stat-card"><div className="stat-val">{stats.invoices}</div><div className="stat-label">Invoices</div></div>
        <div className="stat-card"><div className="stat-val">${stats.revenue.toLocaleString()}</div><div className="stat-label">Revenue Collected</div></div>
        <div className="stat-card"><div className="stat-val" style={{color:'var(--amber)'}}>{stats.requests}</div><div className="stat-label">Service Requests</div></div>
        <div className="stat-card"><div className="stat-val" style={{color:'var(--green)'}}>{stats.scheduled}</div><div className="stat-label">Upcoming Jobs</div></div>
      </div>
      <div className="card">
        <h3 style={{marginBottom:16}}>Recent Service Requests</h3>
        {recent.length === 0 ? <div className="empty">No requests yet</div> : (
          <table>
            <thead><tr><th>Name</th><th>Phone</th><th>Service</th><th>Date</th><th>Status</th></tr></thead>
            <tbody>{recent.map(r => (
              <tr key={r.id}>
                <td>{r.name}</td>
                <td>{r.phone}</td>
                <td>{r.service_type}</td>
                <td>{new Date(r.created_at).toLocaleDateString()}</td>
                <td><span className={`badge badge-${r.status}`}>{r.status}</span></td>
              </tr>
            ))}</tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// ── CUSTOMERS ─────────────────────────────────────────────────
function Customers({ toast }) {
  const [data, setData] = useState([]);
  const [search, setSearch] = useState('');
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({ name:'', email:'', phone:'', address:'', city:'', zip:'', notes:'' });

  const load = useCallback(async () => {
    const { data: d } = await sb.from('customers').select('*').order('created_at', {ascending:false});
    setData(d||[]);
  }, []);

  useEffect(() => { load(); }, [load]);

  const save = async () => {
    if (!form.name) return toast('Name is required', 'error');
    const op = modal === 'add'
      ? sb.from('customers').insert([form])
      : sb.from('customers').update(form).eq('id', form.id);
    const { error } = await op;
    if (error) return toast(error.message, 'error');
    toast(modal === 'add' ? 'Customer added!' : 'Customer updated!', 'success');
    setModal(null); load();
  };

  const del = async (id) => {
    if (!confirm('Delete this customer?')) return;
    await sb.from('customers').delete().eq('id', id);
    toast('Deleted', 'success'); load();
  };

  const filtered = data.filter(c => c.name?.toLowerCase().includes(search.toLowerCase()) || c.phone?.includes(search) || c.email?.toLowerCase().includes(search.toLowerCase()));

  return (
    <div>
      <div className="page-header">
        <h1>Customers</h1>
        <button className="btn btn-primary" onClick={() => { setForm({name:'',email:'',phone:'',address:'',city:'',zip:'',notes:''}); setModal('add'); }}>{Icon.plus} Add Customer</button>
      </div>
      <div className="search-bar">
        <input placeholder="Search by name, phone, email..." value={search} onChange={e=>setSearch(e.target.value)} style={{maxWidth:320}} />
        <span style={{color:'var(--muted)',fontSize:13}}>{filtered.length} customers</span>
      </div>
      <div className="card" style={{padding:0}}>
        <table>
          <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>City</th><th>Actions</th></tr></thead>
          <tbody>
            {filtered.length === 0 && <tr><td colSpan={5}><div className="empty">No customers found</div></td></tr>}
            {filtered.map(c => (
              <tr key={c.id}>
                <td style={{fontWeight:600}}>{c.name}</td>
                <td>{c.phone}</td>
                <td>{c.email}</td>
                <td>{c.city}</td>
                <td>
                  <div style={{display:'flex',gap:6}}>
                    <button className="btn btn-ghost btn-sm" onClick={() => { setForm(c); setModal('edit'); }}>{Icon.edit}</button>
                    <button className="btn btn-ghost btn-sm" style={{color:'var(--red)'}} onClick={() => del(c.id)}>{Icon.trash}</button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {modal && (
        <Modal title={modal === 'add' ? 'Add Customer' : 'Edit Customer'} onClose={() => setModal(null)}>
          <div className="form-grid">
            <div className="form-group"><label>Full Name *</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="John Smith" /></div>
            <div className="form-group"><label>Phone</label><input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="(610) 555-0000" /></div>
            <div className="form-group"><label>Email</label><input value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="john@email.com" /></div>
            <div className="form-group"><label>City</label><input value={form.city} onChange={e=>setForm({...form,city:e.target.value})} placeholder="Wallingford" /></div>
            <div className="form-group form-full"><label>Address</label><input value={form.address} onChange={e=>setForm({...form,address:e.target.value})} placeholder="123 Main St" /></div>
            <div className="form-group"><label>Zip</label><input value={form.zip} onChange={e=>setForm({...form,zip:e.target.value})} placeholder="19086" /></div>
            <div className="form-group form-full"><label>Notes</label><textarea rows={3} value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Internal notes about this customer..." /></div>
          </div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:8}}>
            <button className="btn btn-ghost" onClick={() => setModal(null)}>Cancel</button>
            <button className="btn btn-primary" onClick={save}>Save Customer</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── ESTIMATES ─────────────────────────────────────────────────
function Estimates({ toast, setPage }) {
  const [data, setData] = useState([]);
  const [customers, setCustomers] = useState([]);
  const [services, setServices] = useState([]);
  const [modal, setModal] = useState(null);
  const [viewing, setViewing] = useState(null);
  const [form, setForm] = useState({ customer_id:'', status:'draft', notes:'', items:[] });
  const [search, setSearch] = useState('');

  const load = useCallback(async () => {
    const [e, c, s] = await Promise.all([
      sb.from('estimates').select('*, estimate_items(*)').order('created_at',{ascending:false}),
      sb.from('customers').select('*').order('name'),
      sb.from('services').select('*').where ? sb.from('services').select('*') : sb.from('services').select('*'),
    ]);
    setData(e.data||[]);
    setCustomers(c.data||[]);
    setServices(s.data||[]);
  }, []);

  useEffect(() => { load(); }, [load]);

  const nextNumber = async () => {
    const { data: d } = await sb.from('estimates').select('estimate_number').order('created_at',{ascending:false}).limit(50);
    let max = 0;
    (d||[]).forEach(e => { const m = e.estimate_number?.match(/EST-(\d+)/); if(m) { const n=parseInt(m[1]); if(n>max) max=n; } });
    return `EST-${String(max+1).padStart(3,'0')}`;
  };

  const addItem = (serviceId) => {
    if (!serviceId) return;
    const svc = services.find(s => s.id === serviceId);
    if (!svc) return;
    setForm(f => ({...f, items:[...f.items, {
      id: Date.now().toString(), service_id:svc.id, service_name:svc.name,
      description:svc.description||'', quantity:1, unit_price:Number(svc.price), line_total:Number(svc.price)
    }]}));
  };

  const updateItem = (id, field, val) => {
    setForm(f => ({...f, items: f.items.map(item => {
      if (item.id !== id) return item;
      const updated = {...item, [field]: field==='quantity'||field==='unit_price' ? Number(val) : val};
      updated.line_total = updated.quantity * updated.unit_price;
      return updated;
    })}));
  };

  const subtotal = form.items.reduce((s,i) => s+i.line_total, 0);

  const save = async () => {
    if (!form.customer_id) return toast('Select a customer', 'error');
    if (form.items.length === 0) return toast('Add at least one service', 'error');
    const cust = customers.find(c => c.id === form.customer_id);
    const num = form.id ? form.estimate_number : await nextNumber();
    const estData = {
      estimate_number: num,
      customer_id: form.customer_id,
      customer_name: cust?.name||'',
      customer_email: cust?.email||'',
      customer_phone: cust?.phone||'',
      estimate_date: new Date().toISOString().split('T')[0],
      status: form.status||'draft',
      subtotal, tax:0, total:subtotal,
      notes: form.notes||''
    };
    let estId = form.id;
    if (form.id) {
      const { error } = await sb.from('estimates').update(estData).eq('id', form.id);
      if (error) return toast(error.message, 'error');
      await sb.from('estimate_items').delete().eq('estimate_id', form.id);
    } else {
      const { data: d, error } = await sb.from('estimates').insert([estData]).select().single();
      if (error) return toast(error.message, 'error');
      estId = d.id;
    }
    if (form.items.length > 0) {
      const items = form.items.map(i => ({ estimate_id:estId, service_name:i.service_name, description:i.description, quantity:i.quantity, unit_price:i.unit_price, line_total:i.line_total }));
      await sb.from('estimate_items').insert(items);
    }
    toast(form.id ? 'Estimate updated!' : 'Estimate created!', 'success');
    setModal(null); load();
  };

  const convertToInvoice = async (est) => {
    const { data: existing } = await sb.from('invoices').select('invoice_number').order('created_at',{ascending:false}).limit(50);
    let max = 0;
    (existing||[]).forEach(e => { const m = e.invoice_number?.match(/INV-(\d+)/); if(m){const n=parseInt(m[1]);if(n>max)max=n;} });
    const invNum = `INV-${String(max+1).padStart(3,'0')}`;
    const due = new Date(); due.setDate(due.getDate()+30);
    const { data: inv, error } = await sb.from('invoices').insert([{
      invoice_number: invNum,
      customer_id: est.customer_id,
      customer_name: est.customer_name,
      customer_email: est.customer_email,
      customer_phone: est.customer_phone,
      invoice_date: new Date().toISOString().split('T')[0],
      due_date: due.toISOString().split('T')[0],
      status:'sent', payment_status:'unpaid',
      subtotal: est.subtotal, tax: est.tax, total: est.total,
      notes: est.notes, estimate_id: est.id
    }]).select().single();
    if (error) return toast(error.message, 'error');
    const items = (est.estimate_items||[]).map(i => ({ invoice_id:inv.id, service_name:i.service_name, description:i.description, quantity:i.quantity, unit_price:i.unit_price, line_total:i.line_total }));
    if (items.length > 0) await sb.from('invoice_items').insert(items);
    await sb.from('estimates').update({ status:'converted', converted_to_invoice_id:inv.id }).eq('id', est.id);
    toast(`Converted to ${invNum}!`, 'success'); load();
  };

  const del = async (id) => {
    if (!confirm('Delete this estimate?')) return;
    await sb.from('estimates').delete().eq('id', id);
    toast('Deleted', 'success'); load();
  };

  const openEdit = (est) => {
    setForm({
      id: est.id, estimate_number: est.estimate_number,
      customer_id: est.customer_id, status: est.status, notes: est.notes||'',
      items: (est.estimate_items||[]).map(i => ({...i, id:i.id||Date.now().toString()}))
    });
    setModal('edit');
  };

  const filtered = data.filter(e => e.estimate_number?.toLowerCase().includes(search.toLowerCase()) || e.customer_name?.toLowerCase().includes(search.toLowerCase()));

  return (
    <div>
      <div className="page-header">
        <h1>Estimates</h1>
        <button className="btn btn-primary" onClick={() => { setForm({customer_id:'',status:'draft',notes:'',items:[]}); setModal('add'); }}>{Icon.plus} New Estimate</button>
      </div>
      <div className="search-bar">
        <input placeholder="Search by number or customer..." value={search} onChange={e=>setSearch(e.target.value)} style={{maxWidth:320}} />
      </div>
      <div className="card" style={{padding:0}}>
        <table>
          <thead><tr><th>Estimate #</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            {filtered.length===0 && <tr><td colSpan={6}><div className="empty">No estimates yet</div></td></tr>}
            {filtered.map(e => (
              <tr key={e.id}>
                <td style={{fontWeight:700,color:'var(--cyan)'}}>{e.estimate_number}</td>
                <td>{e.customer_name}</td>
                <td>{e.estimate_date}</td>
                <td style={{fontWeight:600}}>${Number(e.total).toFixed(2)}</td>
                <td><span className={`badge badge-${e.status}`}>{e.status}</span></td>
                <td>
                  <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                    <button className="btn btn-ghost btn-sm" onClick={() => setViewing(e)} title="View">👁</button>
                    <button className="btn btn-ghost btn-sm" onClick={() => openEdit(e)} title="Edit">{Icon.edit}</button>
                    {e.status !== 'converted' && <button className="btn btn-ghost btn-sm" style={{color:'var(--cyan)'}} onClick={() => convertToInvoice(e)} title="Convert to Invoice">{Icon.convert}</button>}
                    <button className="btn btn-ghost btn-sm" style={{color:'var(--red)'}} onClick={() => del(e.id)}>{Icon.trash}</button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Add/Edit Modal */}
      {(modal === 'add' || modal === 'edit') && (
        <Modal title={modal==='add'?'New Estimate':'Edit Estimate'} onClose={()=>setModal(null)} lg>
          <div className="form-grid" style={{marginBottom:16}}>
            <div className="form-group">
              <label>Customer *</label>
              <select value={form.customer_id} onChange={e=>setForm({...form,customer_id:e.target.value})}>
                <option value="">Select customer...</option>
                {customers.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label>Status</label>
              <select value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>
                <option value="draft">Draft</option>
                <option value="sent">Sent</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
              </select>
            </div>
          </div>

          <div style={{marginBottom:16}}>
            <label style={{marginBottom:8,display:'block'}}>Add Service</label>
            <select onChange={e=>{addItem(e.target.value);e.target.value=''}}>
              <option value="">Select a service to add...</option>
              {services.map(s=><option key={s.id} value={s.id}>{s.name} {s.is_estimate?'(Free Estimate)':'— $'+Number(s.price).toFixed(2)}</option>)}
            </select>
          </div>

          {form.items.length > 0 && (
            <div style={{marginBottom:16,border:'1px solid var(--border)',borderRadius:8,overflow:'hidden'}}>
              <table>
                <thead><tr><th>Service</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr></thead>
                <tbody>
                  {form.items.map(item=>(
                    <tr key={item.id}>
                      <td style={{fontWeight:500}}>{item.service_name}</td>
                      <td><input type="number" min="1" value={item.quantity} onChange={e=>updateItem(item.id,'quantity',e.target.value)} style={{width:60}} /></td>
                      <td><input type="number" min="0" step="0.01" value={item.unit_price} onChange={e=>updateItem(item.id,'unit_price',e.target.value)} style={{width:90}} /></td>
                      <td style={{fontWeight:600}}>${item.line_total.toFixed(2)}</td>
                      <td><button className="btn btn-ghost btn-sm" style={{color:'var(--red)'}} onClick={()=>setForm(f=>({...f,items:f.items.filter(i=>i.id!==item.id)}))}>{Icon.x}</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div style={{padding:'12px 16px',background:'var(--surface2)',textAlign:'right'}}>
                <div className="total-row grand" style={{justifyContent:'flex-end',gap:16}}><span>Total:</span><span>${subtotal.toFixed(2)}</span></div>
              </div>
            </div>
          )}

          <div className="form-group"><label>Notes</label><textarea rows={3} value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Notes visible on the estimate..." /></div>

          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <button className="btn btn-ghost" onClick={()=>setModal(null)}>Cancel</button>
            <button className="btn btn-primary" onClick={save}>Save Estimate</button>
          </div>
        </Modal>
      )}

      {/* View Modal */}
      {viewing && (
        <Modal title={`Estimate ${viewing.estimate_number}`} onClose={()=>setViewing(null)} lg>
          <div style={{marginBottom:20,display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            <div><label>Customer</label><p style={{fontWeight:600,marginTop:4}}>{viewing.customer_name}</p></div>
            <div><label>Date</label><p style={{marginTop:4}}>{viewing.estimate_date}</p></div>
            <div><label>Phone</label><p style={{marginTop:4}}>{viewing.customer_phone}</p></div>
            <div><label>Email</label><p style={{marginTop:4}}>{viewing.customer_email}</p></div>
          </div>
          <table style={{marginBottom:16}}>
            <thead><tr><th>Service</th><th>Qty</th><th>Unit Price</th><th>Total</th></tr></thead>
            <tbody>
              {(viewing.estimate_items||[]).map(i=>(
                <tr key={i.id}>
                  <td>{i.service_name}</td>
                  <td>{i.quantity}</td>
                  <td>${Number(i.unit_price).toFixed(2)}</td>
                  <td style={{fontWeight:600}}>${Number(i.line_total).toFixed(2)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{textAlign:'right',marginBottom:16}}>
            <div className="total-row grand" style={{justifyContent:'flex-end',gap:16}}><span>Total:</span><span>${Number(viewing.total).toFixed(2)}</span></div>
          </div>
          {viewing.notes && <div style={{background:'var(--surface2)',padding:12,borderRadius:6,fontSize:13,color:'var(--muted)'}}>{viewing.notes}</div>}
          <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:20}}>
            {viewing.status !== 'converted' && <button className="btn btn-primary" onClick={()=>{convertToInvoice(viewing);setViewing(null)}}>{Icon.convert} Convert to Invoice</button>}
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── SCHEDULING ────────────────────────────────────────────────
function Scheduling({ toast }) {
  const [data, setData] = useState([]);
  const [customers, setCustomers] = useState([]);
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({ customer_id:'', service_type:'', scheduled_date:'', scheduled_time:'', address:'', notes:'', status:'scheduled', technician:'' });

  const load = useCallback(async () => {
    const [a, c] = await Promise.all([
      sb.from('appointments').select('*').order('scheduled_date',{ascending:true}),
      sb.from('customers').select('*').order('name'),
    ]);
    setData(a.data||[]); setCustomers(c.data||[]);
  }, []);

  useEffect(() => { load(); }, [load]);

  const save = async () => {
    if (!form.customer_id || !form.scheduled_date) return toast('Customer and date required', 'error');
    const cust = customers.find(c=>c.id===form.customer_id);
    const payload = {...form, customer_name:cust?.name||'', customer_phone:cust?.phone||'', customer_email:cust?.email||''};
    const op = form.id
      ? sb.from('appointments').update(payload).eq('id',form.id)
      : sb.from('appointments').insert([payload]);
    const { error } = await op;
    if (error) return toast(error.message,'error');
    toast(form.id?'Updated!':'Scheduled!','success'); setModal(null); load();
  };

  const del = async (id) => {
    if (!confirm('Delete this appointment?')) return;
    await sb.from('appointments').delete().eq('id',id);
    toast('Deleted','success'); load();
  };

  const upcoming = data.filter(a => a.status==='scheduled' && new Date(a.scheduled_date) >= new Date(new Date().toDateString()));
  const past = data.filter(a => a.status!=='scheduled' || new Date(a.scheduled_date) < new Date(new Date().toDateString()));

  return (
    <div>
      <div className="page-header">
        <h1>Scheduling</h1>
        <button className="btn btn-primary" onClick={()=>{setForm({customer_id:'',service_type:'',scheduled_date:'',scheduled_time:'',address:'',notes:'',status:'scheduled',technician:''});setModal(true)}}>{Icon.plus} Schedule Job</button>
      </div>

      <h3 style={{marginBottom:12,color:'var(--cyan)'}}>Upcoming Jobs ({upcoming.length})</h3>
      <div className="card" style={{padding:0,marginBottom:24}}>
        <table>
          <thead><tr><th>Date</th><th>Time</th><th>Customer</th><th>Service</th><th>Address</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            {upcoming.length===0 && <tr><td colSpan={7}><div className="empty">No upcoming jobs</div></td></tr>}
            {upcoming.map(a=>(
              <tr key={a.id}>
                <td style={{fontWeight:600}}>{a.scheduled_date}</td>
                <td>{a.scheduled_time}</td>
                <td>{a.customer_name}</td>
                <td>{a.service_type}</td>
                <td style={{color:'var(--muted)',fontSize:13}}>{a.address}</td>
                <td><span className={`badge badge-${a.status}`}>{a.status}</span></td>
                <td>
                  <div style={{display:'flex',gap:6}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>{setForm(a);setModal(true)}}>{Icon.edit}</button>
                    <button className="btn btn-ghost btn-sm" style={{color:'var(--red)'}} onClick={()=>del(a.id)}>{Icon.trash}</button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {past.length > 0 && <>
        <h3 style={{marginBottom:12,color:'var(--muted)'}}>Past Jobs ({past.length})</h3>
        <div className="card" style={{padding:0}}>
          <table>
            <thead><tr><th>Date</th><th>Customer</th><th>Service</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>{past.map(a=>(
              <tr key={a.id}>
                <td>{a.scheduled_date}</td><td>{a.customer_name}</td><td>{a.service_type}</td>
                <td><span className={`badge badge-${a.status}`}>{a.status}</span></td>
                <td><button className="btn btn-ghost btn-sm" style={{color:'var(--red)'}} onClick={()=>del(a.id)}>{Icon.trash}</button></td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      </>}

      {modal && (
        <Modal title={form.id?'Edit Appointment':'Schedule New Job'} onClose={()=>setModal(null)}>
          <div className="form-grid">
            <div className="form-group form-full">
              <label>Customer *</label>
              <select value={form.customer_id} onChange={e=>setForm({...form,customer_id:e.target.value})}>
                <option value="">Select customer...</option>
                {customers.map(c=><option key={c.id} value={c.id}>{c.name} — {c.phone}</option>)}
              </select>
            </div>
            <div className="form-group"><label>Date *</label><input type="date" value={form.scheduled_date} onChange={e=>setForm({...form,scheduled_date:e.target.value})} /></div>
            <div className="form-group"><label>Time</label><input type="time" value={form.scheduled_time} onChange={e=>setForm({...form,scheduled_time:e.target.value})} /></div>
            <div className="form-group form-full">
              <label>Service Type</label>
              <select value={form.service_type} onChange={e=>setForm({...form,service_type:e.target.value})}>
                <option value="">Select service...</option>
                {['Chimney Cleaning','Level 1 Inspection','Level 2 Inspection','Level 3 Inspection','Dryer Vent Cleaning','Chimney Repair','Flue Relining','Stove Services','Estimate Visit'].map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
            <div className="form-group form-full"><label>Job Address</label><input value={form.address} onChange={e=>setForm({...form,address:e.target.value})} placeholder="123 Main St, Wallingford PA" /></div>
            <div className="form-group">
              <label>Status</label>
              <select value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>
                <option value="scheduled">Scheduled</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
                <option value="no_show">No Show</option>
              </select>
            </div>
            <div className="form-group"><label>Technician</label><input value={form.technician} onChange={e=>setForm({...form,technician:e.target.value})} placeholder="Your name" /></div>
            <div className="form-group form-full"><label>Notes</label><textarea rows={3} value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} /></div>
          </div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
            <button className="btn btn-ghost" onClick={()=>setModal(null)}>Cancel</button>
            <button className="btn btn-primary" onClick={save}>Save Appointment</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

              <tr key={s.id}>
                <td style={{fontWeight:600}}>{s.name}</td>
                <td style={{color:'var(--muted)',fontSize:13,maxWidth:240}}>{s.description}</td>
                <td style={{fontWeight:600,color:'var(--cyan)'}}>{s.is_estimate ? 'Free Estimate' : '$'+Number(s.price).toFixed(2)}</td>
                <td><span className="badge badge-draft">{s.is_estimate?'Estimate':'Fixed'}</span></td>
                <td><span className={`badge ${s.is_active?'badge-approved':'badge-draft'}`}>{s.is_active?'Active':'Inactive'}</span></td>
                <td>
                  <div style={{display:'flex',gap:6}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>{setForm(s);setModal(true)}}>{Icon.edit}</button>
                    <button className="btn btn-ghost btn-sm" style={{color:'var(--red)'}} onClick={()=>del(s.id)}>{Icon.trash}</button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {modal && (
        <Modal title={form.id?'Edit Service':'Add Service'} onClose={()=>setModal(null)}>
          <div className="form-group"><label>Service Name *</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Chimney Cleaning" /></div>
          <div className="form-group"><label>Description</label><textarea rows={2} value={form.description||''} onChange={e=>setForm({...form,description:e.target.value})} /></div>
          <div className="form-grid">
            <div className="form-group">
              <label>Price ($)</label>
              <input type="number" min="0" step="0.01" value={form.price} onChange={e=>setForm({...form,price:parseFloat(e.target.value)||0})} disabled={form.is_estimate} />
            </div>
            <div className="form-group" style={{display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
              <label style={{marginBottom:8}}>
                <input type="checkbox" checked={form.is_estimate} onChange={e=>setForm({...form,is_estimate:e.target.checked,price:e.target.checked?0:form.price})} style={{width:'auto',marginRight:8}} />
                Free Estimate (no fixed price)
              </label>
              <label>
                <input type="checkbox" checked={form.is_active} onChange={e=>setForm({...form,is_active:e.target.checked})} style={{width:'auto',marginRight:8}} />
                Active (show in estimates)
              </label>
            </div>
          </div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:8}}>
            <button className="btn btn-ghost" onClick={()=>setModal(null)}>Cancel</button>
            <button className="btn btn-primary" onClick={save}>Save Service</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── SERVICE REQUESTS ──────────────────────────────────────────
function Requests({ toast }) {
  const [data, setData] = useState([]);
  const [viewing, setViewing] = useState(null);

  const load = useCallback(async () => {
    const { data: d } = await sb.from('service_requests').select('*').order('created_at',{ascending:false});
    setData(d||[]);
  }, []);

  useEffect(() => { load(); }, [load]);

  const updateStatus = async (id, status) => {
    await sb.from('service_requests').update({status}).eq('id',id);
    toast('Updated!','success'); load();
  };

  const del = async (id) => {
    if (!confirm('Delete?')) return;
    await sb.from('service_requests').delete().eq('id',id);
    toast('Deleted','success'); load();
  };

  return (
    <div>
      <div className="page-header"><h1>Service Requests</h1><span style={{color:'var(--muted)',fontSize:14}}>{data.filter(r=>r.status==='new').length} new</span></div>
      <div className="card" style={{padding:0}}>
        <table>
          <thead><tr><th>Name</th><th>Phone</th><th>Service</th><th>Received</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            {data.length===0 && <tr><td colSpan={6}><div className="empty">No requests yet</div></td></tr>}
            {data.map(r=>(
              <tr key={r.id}>
                <td style={{fontWeight:600}}>{r.name}</td>
                <td>{r.phone}</td>
                <td>{r.service_type}</td>
                <td style={{color:'var(--muted)',fontSize:13}}>{new Date(r.created_at).toLocaleDateString()}</td>
                <td><span className={`badge badge-${r.status}`}>{r.status}</span></td>
                <td>
                  <div style={{display:'flex',gap:6}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setViewing(r)}>👁</button>
                    {r.status==='new' && <button className="btn btn-ghost btn-sm" style={{color:'var(--green)'}} onClick={()=>updateStatus(r.id,'contacted')}>Contacted</button>}
                    <button className="btn btn-ghost btn-sm" style={{color:'var(--red)'}} onClick={()=>del(r.id)}>{Icon.trash}</button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {viewing && (
        <Modal title="Service Request" onClose={()=>setViewing(null)}>
          <div className="form-grid">
            <div><label>Name</label><p style={{marginTop:4,fontWeight:600}}>{viewing.name}</p></div>
            <div><label>Phone</label><p style={{marginTop:4}}>{viewing.phone}</p></div>
            <div><label>Email</label><p style={{marginTop:4}}>{viewing.email}</p></div>
            <div><label>Service</label><p style={{marginTop:4}}>{viewing.service_type}</p></div>
            <div className="form-full"><label>Address</label><p style={{marginTop:4}}>{viewing.address}</p></div>
            <div className="form-full"><label>Message</label><p style={{marginTop:4,color:'var(--muted)',fontSize:14,lineHeight:1.6}}>{viewing.message}</p></div>
          </div>
          <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:16}}>
            <a href={`tel:${viewing.phone}`} className="btn btn-primary">📞 Call Now</a>
            <a href={`mailto:${viewing.email}`} className="btn btn-ghost">{Icon.mail} Email</a>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── APP ────────────────────────────────────────────────────────
const PAGES = [
  { id:'dashboard', label:'Dashboard', icon:'dash' },
  { id:'customers', label:'Customers', icon:'users' },
  { id:'estimates', label:'Estimates', icon:'file' },
  { id:'invoices',  label:'Invoices',  icon:'invoice' },
  { id:'scheduling',label:'Scheduling',icon:'cal' },
  { id:'services',  label:'Services & Pricing', icon:'wrench' },
  { id:'requests',  label:'Service Requests', icon:'inbox' },
];

function App() {
  const [page, setPage] = useState('dashboard');
  const [toastMsg, setToastMsg] = useState(null);

  const toast = (msg, type='success') => setToastMsg({msg,type});

  const renderPage = () => {
    const props = { toast, setPage };
    switch(page) {
      case 'dashboard': return <Dashboard {...props} />;
      case 'customers': return <Customers {...props} />;
      case 'estimates': return <Estimates {...props} />;
      case 'invoices': return <Invoices {...props} />;
      case 'scheduling': return <Scheduling {...props} />;
      case 'services': return <Services {...props} />;
      case 'requests': return <Requests {...props} />;
      default: return <Dashboard {...props} />;
    }
  };

  return (
    <div style={{display:'flex'}}>
      <aside className="sidebar">
        <div className="nav-logo">
          <h2>DELCO CHIMNEY SWEEPS</h2>
          <p>Admin Dashboard</p>
        </div>
        {PAGES.map(p=>(
          <button key={p.id} className={`nav-item ${page===p.id?'active':''}`} onClick={()=>setPage(p.id)}>
            {Icon[p.icon]} {p.label}
          </button>
        ))}
        <div style={{position:'absolute',bottom:20,left:0,right:0,padding:'0 20px'}}>
          <div style={{fontSize:11,color:'var(--muted)',lineHeight:1.6}}>
            <div style={{fontWeight:600,color:'var(--text)',marginBottom:4}}>Delco Chimney Sweeps</div>
            <div>(610) 803-9649</div>
            <div>Wallingford, PA 19086</div>
          </div>
        </div>
      </aside>
      <main className="main">{renderPage()}</main>
      {toastMsg && <Toast msg={toastMsg.msg} type={toastMsg.type} onClose={()=>setToastMsg(null)} />}
    </div>
  );
}

// ── LOGIN ──────────────────────────────────────────────────────
const ADMIN_PASS = 'delco2026'; // Change this to your own password

function tryLogin() {
  const val = document.getElementById('loginPass').value;
  if (val === ADMIN_PASS) {
    sessionStorage.setItem('delco_admin', '1');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appRoot').style.display = 'block';
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  } else {
    document.getElementById('loginErr').style.display = 'block';
    document.getElementById('loginPass').value = '';
  }
}

document.getElementById('loginBtn').addEventListener('click', tryLogin);
document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key==='Enter') tryLogin(); });

// Auto-login if already authenticated this session
if (sessionStorage.getItem('delco_admin') === '1') {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
